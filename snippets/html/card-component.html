<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clean Card Component</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f1f5f9; padding: 2rem; }
    .card {
      background: #ffffff;
      border-radius: 10px;
      padding: 1.5rem;
      max-width: 360px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }
    .card-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      background: #e0f2fe;
      color: #0369a1;
      margin-bottom: 0.75rem;
    }
    .card-title { margin: 0 0 0.5rem 0; font-size: 1.25rem; color: #0f172a; }
    .card-text { color: #64748b; font-size: 0.95rem; line-height: 1.5; margin-bottom: 1.25rem; }
    .card-link { color: #2563eb; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <span class="card-badge">Snippet</span>
    <h3 class="card-title">Event Loop Patterns</h3>
    <p class="card-text">Quick overview and cheatsheet for microtask vs macrotask execution order in the browser.</p>
    <a href="#" class="card-link">Read full note &rarr;</a>
  </div>
</body>
</html>
