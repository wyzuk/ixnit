<!DOCTYPE html>
<html>
<body>
  <button onclick="document.getElementById('dlg').showModal()">Open Dialog</button>

  <dialog id="dlg" style="padding: 1.5rem; border-radius: 8px; border: 1px solid #ccc;">
    <h3>Simple Native Modal</h3>
    <p>Press Esc or click button to close.</p>
    <button onclick="document.getElementById('dlg').close()">Close</button>
  </dialog>
</body>
</html>
