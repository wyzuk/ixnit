<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible Modal Dialog Snippet</title>
  <style>
    /* Native <dialog> backdrop styling */
    dialog::backdrop {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(3px);
    }
    dialog {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 1.5rem;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      font-family: system-ui, sans-serif;
    }
    dialog[open] {
      animation: fadeIn 0.15s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }
    button {
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Native HTML5 &lt;dialog&gt; Example</h1>
  <p>The native dialog element handles Escape key dismiss and focus trapping automatically!</p>

  <button id="open-btn">Open Dialog</button>

  <dialog id="fav-dialog" aria-labelledby="dialog-title">
    <h2 id="dialog-title" style="margin-top: 0;">Confirm Action</h2>
    <p>Are you sure you want to proceed with this update?</p>
    <div class="modal-actions">
      <button id="cancel-btn" type="button">Cancel</button>
      <button id="confirm-btn" type="button" style="background:#2563eb; color:white; border:none;">Confirm</button>
    </div>
  </dialog>

  <script>
    const dialog = document.getElementById('fav-dialog');
    const openBtn = document.getElementById('open-btn');
    const cancelBtn = document.getElementById('cancel-btn');
    const confirmBtn = document.getElementById('confirm-btn');

    // showModal() activates backdrop and focus trapping
    openBtn.addEventListener('click', () => dialog.showModal());
    cancelBtn.addEventListener('click', () => dialog.close('cancelled'));
    confirmBtn.addEventListener('click', () => {
      alert('Confirmed!');
      dialog.close('confirmed');
    });

    // Close when clicking outside modal content (on the backdrop)
    dialog.addEventListener('click', (e) => {
      const rect = dialog.getBoundingClientRect();
      const isInDialog = (rect.top <= e.clientY && e.clientY <= rect.top + rect.height &&
        rect.left <= e.clientX && e.clientX <= rect.left + rect.width);
      if (!isInDialog) {
        dialog.close();
      }
    });
  </script>
</body>
</html>
