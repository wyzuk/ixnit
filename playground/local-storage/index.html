<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>localStorage Inspector</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 0 15px; }
    input { padding: 6px 10px; margin-right: 5px; }
    button { padding: 6px 12px; cursor: pointer; }
    ul { list-style: none; padding: 0; margin-top: 20px; }
    li { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #ddd; font-family: monospace; }
  </style>
</head>
<body>
  <h3>localStorage Quick Inspector</h3>
  <div>
    <input id="keyInp" placeholder="key">
    <input id="valInp" placeholder="value">
    <button id="setBtn">Set</button>
    <button id="clearBtn">Clear All</button>
  </div>
  <ul id="itemsList"></ul>

  <script>
    const list = document.getElementById('itemsList');
    const keyInp = document.getElementById('keyInp');
    const valInp = document.getElementById('valInp');

    function render() {
      list.innerHTML = '';
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        const v = localStorage.getItem(k);
        const li = document.createElement('li');
        li.innerHTML = `<span>${k}: "${v}"</span> <button onclick="delItem('${k}')">del</button>`;
        list.appendChild(li);
      }
    }

    window.delItem = (k) => {
      localStorage.removeItem(k);
      render();
    };

    document.getElementById('setBtn').onclick = () => {
      if (keyInp.value) {
        localStorage.setItem(keyInp.value, valInp.value);
        keyInp.value = '';
        valInp.value = '';
        render();
      }
    };

    document.getElementById('clearBtn').onclick = () => {
      localStorage.clear();
      render();
    };

    render();
  </script>
</body>
</html>
