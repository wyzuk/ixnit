<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Canvas Clock</title>
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: ui-monospace, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .digital { font-size: 3rem; font-weight: 700; letter-spacing: 2px; }
    .date { color: #94a3b8; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <div class="digital" id="clock">00:00:00</div>
  <div class="date" id="date-label">---</div>

  <script>
    const clock = document.getElementById('clock');
    const dateLabel = document.getElementById('date-label');

    function update() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');

      clock.textContent = `${hours}:${minutes}:${seconds}`;
      dateLabel.textContent = now.toLocaleDateString(undefined, {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });
    }

    update();
    setInterval(update, 1000);
  </script>
</body>
</html>
