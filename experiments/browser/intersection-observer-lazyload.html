<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IntersectionObserver Lazy Loading Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 2rem; max-width: 650px; margin: auto; }
    .spacer { height: 70vh; background: #f8fafc; border: 1px dashed #cbd5e1; display: flex; align-items: center; justify-content: center; margin-bottom: 2rem; color: #94a3b8; }
    .lazy-box {
      min-height: 200px;
      background: #e2e8f0;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: #475569;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.6s ease-out, transform 0.6s ease-out;
      margin-bottom: 2rem;
    }
    .lazy-box.loaded {
      opacity: 1;
      transform: translateY(0);
      background: #dbeafe;
      color: #1e40af;
    }
  </style>
</head>
<body>
  <h2>IntersectionObserver Sandbox</h2>
  <p>Scroll down to see boxes animate in as they enter the viewport.</p>

  <div class="spacer">Scroll Down ↓</div>

  <div class="lazy-box" data-label="Section A">Lazy Section 1</div>
  <div class="lazy-box" data-label="Section B">Lazy Section 2</div>
  <div class="lazy-box" data-label="Section C">Lazy Section 3</div>

  <script>
    const boxes = document.querySelectorAll('.lazy-box');

    const observer = new IntersectionObserver((entries, obs) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('loaded');
          // Once animated, no need to observe it again
          obs.unobserve(entry.target);
        }
      });
    }, {
      rootMargin: '0px 0px -50px 0px', // Trigger slightly before it hits bottom
      threshold: 0.15
    });

    boxes.forEach(b => observer.observe(b));
  </script>
</body>
</html>
