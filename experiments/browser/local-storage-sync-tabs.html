<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cross-Tab Sync via StorageEvent</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 2rem; max-width: 500px; margin: auto; }
    textarea { width: 100%; height: 120px; padding: 0.75rem; border-radius: 6px; border: 1px solid #cbd5e1; font-family: inherit; }
    .tip { background: #fef3c7; color: #92400e; padding: 0.75rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.85rem; }
  </style>
</head>
<body>
  <h2>Multi-Tab Sync Experiment</h2>
  <div class="tip">
    💡 <strong>Test this:</strong> Open this page in two separate browser tabs side by side.
    Typing in one tab instantly updates the other tab via the window <code>'storage'</code> event!
  </div>

  <textarea id="shared-input" placeholder="Type here..."></textarea>

  <script>
    const SYNC_KEY = 'ixnit_cross_tab_sync';
    const input = document.getElementById('shared-input');

    // Load initial
    input.value = localStorage.getItem(SYNC_KEY) || '';

    // Broadcast change when typing
    input.addEventListener('input', (e) => {
      localStorage.setItem(SYNC_KEY, e.target.value);
    });

    // Listen for storage events from other tabs
    // Note: The 'storage' event only fires on OTHER windows/tabs, not the tab that made the change!
    window.addEventListener('storage', (e) => {
      if (e.key === SYNC_KEY) {
        input.value = e.newValue || '';
      }
    });
  </script>
</body>
</html>
