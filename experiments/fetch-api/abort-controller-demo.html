<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AbortController & Canceling Fetches</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 2rem; max-width: 500px; }
    button { padding: 0.6rem 1.2rem; cursor: pointer; margin-right: 0.5rem; }
    #status { margin-top: 1.5rem; font-weight: 500; }
  </style>
</head>
<body>
  <h2>AbortController Demo</h2>
  <p>Useful for canceling stale search requests when user types a new character.</p>

  <button id="start-btn">Start Slow Fetch</button>
  <button id="abort-btn" disabled>Cancel Request</button>

  <div id="status">Idle</div>

  <script>
    const startBtn = document.getElementById('start-btn');
    const abortBtn = document.getElementById('abort-btn');
    const statusDiv = document.getElementById('status');

    let currentController = null;

    startBtn.addEventListener('click', async () => {
      // Abort any existing ongoing request
      if (currentController) {
        currentController.abort();
      }

      currentController = new AbortController();
      startBtn.disabled = true;
      abortBtn.disabled = false;
      statusDiv.textContent = 'Fetching data (simulating 3s delay)...';
      statusDiv.style.color = '#2563eb';

      try {
        // Use httpbin to simulate delay
        const res = await fetch('https://httpbin.org/delay/3', {
          signal: currentController.signal
        });
        const json = await res.json();
        statusDiv.textContent = 'Fetch completed successfully!';
        statusDiv.style.color = '#16a34a';
      } catch (err) {
        if (err.name === 'AbortError') {
          statusDiv.textContent = 'Fetch was aborted by user.';
          statusDiv.style.color = '#d97706';
        } else {
          statusDiv.textContent = 'Fetch error: ' + err.message;
          statusDiv.style.color = '#dc2626';
        }
      } finally {
        startBtn.disabled = false;
        abortBtn.disabled = true;
        currentController = null;
      }
    });

    abortBtn.addEventListener('click', () => {
      if (currentController) {
        currentController.abort();
      }
    });
  </script>
</body>
</html>
