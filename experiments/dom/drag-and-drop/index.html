<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML5 Drag and Drop Sandbox</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>HTML5 Drag & Drop Experiment</h1>
  <p class="desc">Testing native HTML5 Drag and Drop API with Kanban-style columns.</p>

  <div class="board">
    <div class="column" id="col-backlog">
      <h2>Backlog</h2>
      <div class="card" draggable="true" id="task-1">Explore WebSockets API</div>
      <div class="card" draggable="true" id="task-2">Benchmark Map vs Object</div>
      <div class="card" draggable="true" id="task-3">Set up Vim keybindings</div>
    </div>

    <div class="column" id="col-progress">
      <h2>In Progress</h2>
      <div class="card" draggable="true" id="task-4">Vanilla DOM drag and drop</div>
    </div>

    <div class="column" id="col-done">
      <h2>Done</h2>
      <div class="card" draggable="true" id="task-5">Git reset vs revert notes</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
