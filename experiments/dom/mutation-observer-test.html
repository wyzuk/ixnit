<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MutationObserver Experiment</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 2rem; max-width: 600px; }
    #log { background: #1e293b; color: #38bdf8; padding: 1rem; border-radius: 6px; font-family: monospace; height: 180px; overflow-y: auto; margin-top: 1rem; }
    .box { display: inline-block; padding: 0.5rem 1rem; background: #e0e7ff; margin: 0.25rem; border-radius: 4px; }
    button { padding: 0.5rem 1rem; margin-right: 0.5rem; cursor: pointer; }
  </style>
</head>
<body>
  <h2>MutationObserver API Playground</h2>
  <p>Watches DOM changes (attributes, child nodes) without polling.</p>

  <div>
    <button id="add-btn">Add Element</button>
    <button id="mutate-btn">Toggle Attribute</button>
    <button id="clear-btn">Clear Target</button>
  </div>

  <div id="target-container" style="border: 2px dashed #cbd5e1; padding: 1rem; margin-top: 1rem; min-height: 80px;" data-status="ready">
    <div class="box">Initial Child</div>
  </div>

  <h3>Mutation Event Stream:</h3>
  <pre id="log"></pre>

  <script>
    const target = document.getElementById('target-container');
    const logEl = document.getElementById('log');

    function log(msg) {
      logEl.textContent += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    // Initialize MutationObserver
    const observer = new MutationObserver((mutationsList) => {
      for (const mutation of mutationsList) {
        if (mutation.type === 'childList') {
          log(`childList: +${mutation.addedNodes.length} added, -${mutation.removedNodes.length} removed`);
        } else if (mutation.type === 'attributes') {
          log(`attribute "${mutation.attributeName}" changed to "${target.getAttribute(mutation.attributeName)}"`);
        }
      }
    });

    observer.observe(target, {
      attributes: true,
      childList: true,
      subtree: false
    });

    document.getElementById('add-btn').addEventListener('click', () => {
      const el = document.createElement('div');
      el.className = 'box';
      el.textContent = 'Child #' + (target.children.length + 1);
      target.appendChild(el);
    });

    document.getElementById('mutate-btn').addEventListener('click', () => {
      const current = target.getAttribute('data-status');
      target.setAttribute('data-status', current === 'ready' ? 'active' : 'ready');
    });

    document.getElementById('clear-btn').addEventListener('click', () => {
      target.innerHTML = '';
    });
  </script>
</body>
</html>
