<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vanilla DOM Todo Experiment</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="todo-app">
    <header>
      <h1>Ixnit Tasks</h1>
      <p class="subtitle">Vanilla DOM manipulation sandbox with localStorage sync</p>
    </header>

    <form id="todo-form">
      <input type="text" id="todo-input" placeholder="What needs to get done?" autocomplete="off" required>
      <button type="submit" id="add-btn">Add Task</button>
    </form>

    <div class="filter-bar">
      <span id="items-left">0 items left</span>
      <div class="filter-buttons">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>
      <button id="clear-completed-btn">Clear Completed</button>
    </div>

    <ul id="todo-list" class="todo-list"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
